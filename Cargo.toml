[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.25-rc3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/michaelbaker-dev/spandeck"
homepage = "https://github.com/michaelbaker-dev/spandeck"

[workspace.dependencies]
spandeck-terminal = { path = "crates/terminal" }
spandeck-core = { path = "crates/core" }
spandeck-agents = { path = "crates/agents" }
spandeck-archive = { path = "crates/archive" }
spandeck-web = { path = "crates/web" }

alacritty_terminal = "0.26"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "ioctl", "socket", "uio", "user", "hostname", "poll"] }
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
# Win32 calls for the platform layer (crates/terminal/src/sys/windows.rs):
# ConPTY, job objects, the named pipe's access list, keep-awake. Already in
# the tree through tokio; only the feature list is ours.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Threading"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rusqlite = { version = "0.42", features = ["bundled"] }
ulid = "3"
toml = "1"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"
tokio-tungstenite = "0.30"
bytes = "1"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
reqwest = { version = "0.13", features = ["json"] }
# TLS for the Control Deck on the station's own Tailscale name
# (crates/web/src/tls.rs). All four are already in the tree, through
# reqwest and axum, with the same TLS library and provider.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower = { version = "0.5", features = ["util"] }
# Tests only: a throwaway authority and certificates for stations on localhost.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
insta = { version = "1", features = ["json"] }
proptest = "1"
turmoil = "0.7"
tempfile = "3"

[profile.release]
opt-level = 3
# What is published is the production build: no debug information in it.
# With it the two programs were 237 MB each and a release 110 MB, which a
# station on a slow line could not download in the time it was given
# (21 Nov 2026). Function names are kept, so a backtrace still names where
# it was; a panic says its file and line as before.
debug = 0
strip = "debuginfo"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
