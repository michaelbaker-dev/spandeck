[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/spandeck/spandeck"
rust-version = "1.85"

[workspace.dependencies]
spandeck-terminal = { path = "crates/terminal" }
spandeck-core = { path = "crates/core" }
spandeck-agents = { path = "crates/agents" }
spandeck-archive = { path = "crates/archive" }
spandeck-web = { path = "crates/web" }

alacritty_terminal = "0.26"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "ioctl", "socket", "uio", "user", "hostname", "poll"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rusqlite = { version = "0.42", features = ["bundled"] }
ulid = "3"
toml = "1"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"
bytes = "1"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
insta = { version = "1", features = ["json"] }
proptest = "1"
turmoil = "0.7"
tempfile = "3"

[profile.release]
opt-level = 3
debug = 1

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
