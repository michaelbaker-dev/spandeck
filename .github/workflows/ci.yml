# Merge tier: everything fast, plus browser smoke, on macOS and Linux.
# Windows has its own job below (DECISIONS.md, "Windows").
# Budget: under 10 minutes.
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (replays, fixtures, scenarios, simulation, browser smoke, handoff)
        run: cargo test --workspace --no-fail-fast
        env:
          # Hosted runners ship Chrome; the browser tests find it.
          SPANDECK_CHROME: ${{ matrix.os == 'macos-latest' && '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' || '/usr/bin/google-chrome' }}
  # Windows, stage one. The first two steps must pass: everything builds, and
  # the tests written for Windows or expected to be the same there run (the
  # terminal layer with ConPTY and the named pipe, the agent and archive
  # crates, the core's own tests, and the Windows station scenarios). The
  # last step runs the scenario tests written for Unix; each one known to
  # need Unix is ignored there with its reason, and the browser tests are
  # left out by name until Chrome has been tried on this runner. That step
  # reports without failing the job until those tests have been seen to pass
  # on Windows; then the allowance is removed. Nothing here changes how the
  # macOS and Linux job reports.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build and lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (terminal, agents, archive, core, Windows station scenarios)
        run: |
          cargo test -p spandeck-terminal -p spandeck-agents -p spandeck-archive -p spandeck-core -p spandeck-web --no-fail-fast
          cargo test -p spandeck --test windows --no-fail-fast -- --test-threads=1
      - name: Scenario tests written for Unix (reported, not yet required)
        continue-on-error: true
        run: |
          choco install sqlite -y --no-progress
          cargo test -p spandeck --no-fail-fast -- --skip browser --skip screenshots
        env:
          SPANDECK_CHROME: C:\Program Files\Google\Chrome\Application\chrome.exe
