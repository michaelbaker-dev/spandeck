# Nightly: simulation with many seeds, the 50-pane soak, and the three-target
# build. The live canary needs a station with Claude Code and Codex logged in,
# so it runs on the fleet (scripts/canary.sh), not on hosted runners.
name: nightly
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Relay simulation, many seeds
        run: SPANDECK_SIM_SEEDS=500 cargo test -p spandeck-core --test relay_sim --release
      - name: 50-pane soak
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test soak --release -- --ignored
      # Scenario tests that kill and start a station several times: too slow
      # for the every-change check, so they are ignored there.
      - name: After a restart (crash, restart in place, Tailscale address)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test restore -- --ignored
      # The same for a database another program holds locked: each holds it
      # for 12 to 35 seconds.
      - name: Nothing waits for the database (locked 12 s, at an upgrade, 30 s)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test dblock -- --ignored
      # A stopped or restarted agent stays put: each waits whole seconds to
      # see that no mail arrives, one kills two stations, one drives browsers.
      - name: Holds (a stopped agent stays stopped, not reading, after a restart, the deck)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test holds -- --ignored
      # The deck's socket: a channel number from before a reconnect, at a
      # station and through one; and a timing: four answers together arrive
      # within 10 ms (they took 42 ms while each waited to be acknowledged).
      - name: The deck's socket (a stale channel number reaches no pane; answers are not held back)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test socket -- --ignored
      # What is typed from a deck. Names the page chooses, a page that comes
      # back replacing only its own connection, a duplicated tab in a real
      # browser; and a link held still for one second and for five, at a
      # station, through another, and in a real page at two widths: on time,
      # or refused with the count, never late. About three minutes.
      - name: What is typed (names, fencing, a duplicated tab; on time or refused, never late)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test typed -- --ignored --nocapture
      # Four stations, one frozen and one behind a slow link: the local
      # mail wake-up and the healthy station's sync are timed against all
      # four healthy, and printed.
      - name: A frozen station and a slow one delay nobody else
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test isolation -- --ignored --nocapture
      # An idle agent is woken when its mail arrives: eight sends on one
      # station and eight across two, each told within 250 ms (the look
      # once a second took 424 ms at the median), and the times printed.
      - name: An idle agent is told of its mail when it arrives (timings; nobody held is woken)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test wake -- --ignored --nocapture
      # The daemon is ended under running agents (the pane host keeps them):
      # a rule check waits and gets its answer, or is refused at its
      # deadline; an approval is found again by its hook after a restart.
      - name: While spandeck is away (rules hold; an approval survives a restart)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test away -- --ignored --nocapture
      # The deck's refresh in a real browser: a station frozen and one that
      # answers as 0.4.5 did; and what an idle deck asks, counted against
      # the 816 calls a minute of before.
      - name: The deck asks each station one question (a frozen station, one from before, an idle count)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test refresh -- --ignored --nocapture
      # A machine that cannot download is sent the release over SSH: two
      # real stations are installed and started from what was sent (this
      # station's own copy, and a published release), and join. And the
      # Add a machine dialog on a phone, which says so as progress. About
      # twenty seconds.
      - name: Add a machine (a release sent over SSH installs and joins; the dialog on a phone)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p spandeck --test phase5 a_machine_that_cannot_download_is_sent -- --ignored
          cargo test -p spandeck --test phase5 add_a_machine_on_a_phone -- --ignored
      # A station is renamed (from another station's deck, from its own
      # command line, by hand in its config file) with a pane, a layout, a
      # look, mail and a waiting stop that name it, and a station that is
      # off meanwhile; a name that is only a former name is "removed"
      # without touching the station; a newcomer whose name is taken joins
      # under another; two names that differ by capitals; and the dialogs
      # in a real browser, with Tailscale SSH waiting for the owner. About
      # a minute.
      - name: A station is renamed, and no two stations have one name
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test rename -- --ignored --nocapture
      # A station that cannot reach the release host takes another
      # station's own running program (tens of megabytes) and upgrades to
      # it, while calls between the two are timed: none may be held up by
      # the transfer. About fifteen seconds.
      - name: A release supplied by the fleet (a station's own copy; calls are not held up meanwhile)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test supply -- --ignored --nocapture
      # Chat for every pane, in a real browser at a phone's width and a
      # computer's: a layout of a Codex whose hooks never ran and a shell,
      # each with Chat and Terminal. And one chat for every pane: a Claude
      # Code-shaped pane, a Codex one, an Antigravity one and one made from
      # a screen are the same component, the log is the only thing that
      # scrolls, and the message box sits on a phone's keyboard. About
      # twenty seconds.
      - name: Chat for every pane, and one chat for all of them (phone and computer, the keyboard)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test chat -- --ignored
      # Sub-agents in a drawer of the agent's pane, in a real browser: the
      # chip in the pane's header only while the agent has sub-agents; the
      # drawer beside the conversation with a row for each and a "Now"
      # that follows it; open or closed remembered across a reload; one
      # opened to read only, with nothing typed into it or under it; a
      # narrow pane; a phone's sheet; markup in what a sub-agent was asked
      # shown as text. About ten seconds.
      - name: Sub-agents in a drawer of the agent's pane (a computer and a phone)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test subagents -- --ignored
      # The microphone of the message box, with stand-ins for the browser's
      # dictation and recorder: a start that throws, one that is never
      # answered, results without end, a stop that is never heard, a hold
      # never let go, a hidden page, a page that is not secure. And a
      # recording turned into text by a stand-in for the owner's speech
      # program, for the owner alone, and deleted. About fifteen seconds.
      - name: The microphone never holds the page; a recording is the owner's alone and is deleted
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test mic -- --ignored
      # A terminal's history on a phone is the browser's to scroll: the rest
      # of it, with the browser's own touches. A pane another window holds
      # (sideways and up), the whole width, a program that prints more than
      # the terminal keeps while earlier output is read, a full-screen
      # program that listens for the mouse, and the lines the page was not
      # sent. About ten seconds. (The measure in the same file is run by
      # hand: docs/measurements.md.)
      - name: A terminal's history on a phone (watched, whole width, a flood, earlier output)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test phonescroll the_rest -- --ignored
      # The Inbox in a real browser at an iPhone's width and a computer's:
      # one size for every title, body and line of where and when, nothing
      # wider than its card, a long body cut and opened by a tap. About five
      # seconds.
      - name: The Inbox is one size of text, and nothing runs off its card (phone and computer)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test inbox -- --ignored
      # HTTPS, the deck saved on the device, and carrying on through
      # another station, in a real browser at a phone's size. The rules of
      # the list and the choice as the plain functions they are; "Turn on
      # secure access" with a stand-in for sudo; four stations of which the
      # serving one is killed, over HTTP and over HTTPS (the bar, the
      # stations by latency, nothing taken while writing, the fastest
      # taken, the pane attached again, the draft kept, Go back); and the
      # saved copy: opened with its station down, with every station down,
      # a new build taken whole, and taken away by the switch. About two
      # and a half minutes.
      - name: A page carries on through another station; the deck saved on the device; HTTPS turned on from the deck
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test failover -- --ignored
      # Agent programs (the owner's report of 17 Nov 2026: "no feedback,
      # don't know if it's doing it, if it worked, don't know if the
      # version listed is the latest"). With stand-in programs, release
      # hosts on this machine and stand-in npm and brew: an update that
      # changes the version, one that finds nothing newer, one that fails;
      # one job at a time; update all; the time limit; a restart in the
      # middle; is it the latest, kept and asked again; an update asked
      # through another station, and the command line; and the dialog at a
      # phone's size. No real agent program is run. About forty seconds.
      - name: Agent programs (every action says what it did; one job at a time; is it the latest; the dialog on a phone)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p spandeck --test agent_programs every_update -- --ignored
          cargo test -p spandeck --test agent_programs an_update_asked -- --ignored
          cargo test -p spandeck --test agent_programs on_a_phone -- --ignored
      # Suites of the merge tier that no step above runs. One failing does
      # not stop the ones after it: each step runs unless the run is cancelled.
      - name: The page says when its link is silent (two daemons and a browser, measured times)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test heartbeat -- --ignored
      - name: What is sent to one pane keeps its order (lanes)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test lanes -- --ignored
      - name: Folder trust and hooks trust (a first screen, a notice before it, mail that waits)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p spandeck --test foldertrust -- --ignored --skip canary_ --skip live_
          cargo test -p spandeck --test hookstrust -- --ignored --skip canary_ --skip live_
      - name: Questions, retries, roles, the record, agent setup
        if: ${{ !cancelled() }}
        run: |
          cargo test -p spandeck --test questions -- --ignored --skip canary_ --skip live_
          cargo test -p spandeck --test retry -- --ignored --skip canary_ --skip live_
          cargo test -p spandeck --test roles -- --ignored --skip canary_ --skip live_
          cargo test -p spandeck --test phase6 -- --ignored --skip canary_ --skip live_ --skip pictures_ --skip screenshots_
          cargo test -p spandeck --test agent_setup -- --ignored --skip canary_ --skip live_ --skip pictures_ --skip screenshots_
      - name: Tools for agents (the station and the deck)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p spandeck --test tools -- --ignored --skip canary_ --skip live_
          cargo test -p spandeck --test tools_deck -- --ignored --skip canary_ --skip live_ --skip pictures_ --skip screenshots_
      # The file explorer's panel, in a real browser with real stations and
      # real files: opened from a pane, the tree, new, rename, delete with
      # Undo, uploads in pieces, copy and paste, a selection dragged from one
      # station to another, names and previews as text, a download's ticket,
      # Move here, a phone, and three themes beside a layout of two panes.
      # About ten seconds. With it the station side's own two-station test
      # (a folder copied from one station to another and downloaded through
      # the first), which no step ran.
      - name: The file explorer (two stations; the panel on a computer and a phone, themes)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p spandeck --test files -- --ignored
          cargo test -p spandeck --test filespanel -- --ignored
      # A pane's header chips, in a real browser: the model, the context,
      # the branch and the cost in a conversation's bar and on a terminal's
      # strip, with the processor and memory of the pane's programs; an
      # update and a locked vault only when it is so; a branch named as
      # markup shown as text; a narrow pane; a light theme and a pane's own
      # look read at 4.5:1; a phone's row and its sheet. About twenty
      # seconds.
      - name: A pane's header chips (a computer and a phone, themes)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test chips -- --ignored
      # A station reached over the owner's own SSH (a link), with two
      # stations and a carrier that is not SSH: a station with no link
      # listens nowhere new; the far deck's page, a call and the socket
      # through the link's port; the sign-in that carries no token, works
      # once, is listed and signed out at the far station; a frozen far
      # side said within the heartbeat's limit and the link back by itself;
      # a far side with no station started, one with no spandeck said; and
      # the far deck with a pane in a real browser. About ten seconds.
      - name: A link to a station with no Tailscale (two stations, no SSH; a browser)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test link -- --ignored
      # `spandeck link add` and `remove`, with two stations, a stand-in for
      # the owner's ssh (a script that runs what it is given in a shell with
      # a throwaway home folder) and a release host: the release sent
      # through the session and installed under the far home, the far
      # station running, exactly one `[[link]]` more in the near config,
      # the running near station taking it up without a restart, the far
      # deck through the port; run again, nothing replaced; `[pane_env]` on
      # a yes, its value in the far config file and nowhere else; remove,
      # with and without uninstalling; an older spandeck left alone on No.
      # About fifteen seconds.
      - name: spandeck link add (two stations, a stand-in for ssh, a release host)
        if: ${{ !cancelled() }}
        run: cargo test -p spandeck --test linkadd -- --ignored
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin spandeck --target ${{ matrix.target }}
