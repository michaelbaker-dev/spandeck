# Security checks: known-vulnerable or badly licensed dependencies, and secrets
# committed by mistake. Runs on every push, every pull request, and daily, because
# new advisories appear against old code.
name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
