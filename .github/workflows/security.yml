# Security checks: known-vulnerable or badly licensed dependencies, and secrets
# committed by mistake. Runs on every push, every pull request, and daily, because
# new advisories appear against old code.
name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks, whole history
        run: |
          v=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 2 . > gitleaks.log 2>&1 || {
            rc=$?
            cat gitleaks.log
            scripts/ci-annotate.sh "gitleaks (exit $rc)" gitleaks.log
            exit $rc
          }
          tail -3 gitleaks.log
