# A version tag builds every target and publishes a GitHub release.
# v0.2.0-beta.1 is a pre-release (the beta channel); v0.2.0 is prod.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, gate: true }
          # Built on Apple silicon for Intel Macs; the gate cannot run there.
          - { os: macos-latest, target: x86_64-apple-darwin, gate: false }
          # The oldest hosted Ubuntu, so the binaries need only its glibc.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, gate: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, gate: true }
          # Windows keeps its panes in the pane host, not by exec: its gate is
          # the pane host's tests and the same upgrade scenarios (phase1).
          - { os: windows-latest, target: x86_64-pc-windows-msvc, gate: false, windows: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Handoff acceptance test (release gate)
        if: matrix.gate
        run: cargo test -p spandeck-terminal --test handoff && cargo test -p spandeck --test phase1 handoff
      - name: Windows station scenarios (release gate)
        if: matrix.windows
        run: cargo test -p spandeck-terminal --test conpty --test local --test host && cargo test -p spandeck --test windows --test phase1
        shell: bash
      - run: cargo build --release --locked --bin spandeck --bin sd --target ${{ matrix.target }}
        if: ${{ !matrix.windows }}
      - run: cargo build --release --locked --bin spandeck --bin sd --bin spandeckd --bin spandeck-pane-host --target ${{ matrix.target }}
        if: matrix.windows
      - name: Package (Windows)
        if: matrix.windows
        shell: pwsh
        run: |
          $name = "spandeck-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist, $name | Out-Null
          $bin = "target/${{ matrix.target }}/release"
          Copy-Item "$bin/spandeck.exe", "$bin/sd.exe", "$bin/spandeckd.exe", "$bin/spandeck-pane-host.exe", README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          # The same form sha256sum writes, in ASCII with a Unix line end.
          [IO.File]::WriteAllText("dist/$name.zip.sha256", "$hash  $name.zip`n")
      - name: Package
        if: ${{ !matrix.windows }}
        run: |
          name=spandeck-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p dist "$name"
          cp target/${{ matrix.target }}/release/spandeck README.md LICENSE "$name/"
          # sd is the same program under a shorter name: a hard link, so the
          # archive holds it once and is half the size to download.
          ln "$name/spandeck" "$name/sd"
          tar -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # Kept for the last job: a release that is published while some
      # targets are still building is "the newest release" with files
      # missing, and a machine added in those minutes finds nothing to
      # install (it happened with v0.4.17 on Apple silicon).
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
