[package]
name = "spandeck"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Always-running daemon and Control Deck for AI coding agents across machines"

[[bin]]
name = "spandeck"
path = "src/main.rs"

# The scriptable test agent. Built with the CLI so scenario tests can run it;
# release packaging ships only `spandeck`.
[[bin]]
name = "spandeck-fake-agent"
path = "src/bin/fake_agent.rs"

[dependencies]
nix.workspace = true
spandeck-core.workspace = true
spandeck-web.workspace = true
spandeck-agents.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
libc.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
reqwest.workspace = true
