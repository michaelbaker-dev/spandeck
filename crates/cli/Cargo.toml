[package]
name = "spandeck"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Always-running daemon and Control Deck for AI coding agents across machines"

[[bin]]
name = "spandeck"
path = "src/main.rs"

# The short command, as decided in the spec ("use sd"). Same program.
[[bin]]
name = "sd"
path = "src/main.rs"

# The scriptable test agent. Built with the CLI so scenario tests can run it;
# release packaging ships only `spandeck`.
[[bin]]
name = "spandeck-fake-agent"
path = "src/bin/fake_agent.rs"

# Windows only in practice: the program the log-on task runs. It has no
# console window and starts `spandeck daemon` without one (DECISIONS.md,
# "Windows"). Built everywhere so it cannot rot; shipped in the Windows zip.
# The pane host: owns the terminals so they outlive the daemon. Used on
# Windows, where the daemon cannot keep them through its own upgrade.
[[bin]]
name = "spandeck-pane-host"
path = "src/bin/pane_host.rs"

[[bin]]
name = "spandeckd"
path = "src/bin/spandeckd.rs"

[dependencies]
spandeck-core.workspace = true
spandeck-web.workspace = true
spandeck-agents.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
spandeck-terminal.workspace = true
base64.workspace = true
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
axum.workspace = true
headless_chrome = { version = "1", default-features = false }
tempfile.workspace = true
# The harness reads a pane's token from the station's database. The same
# build of SQLite the daemon uses; no `sqlite3` program is needed.
rusqlite.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
reqwest.workspace = true
sha2.workspace = true
